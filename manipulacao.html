<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function mudaVisibilidade(id) {
            const elementoHTML = document.getElementById(id)
            if (elementoHTML.className == "mostra") {
                elementoHTML.className = "esconde"
            } else {
                elementoHTML.className = "mostra"
            }
        }function mudaTodas() {
            const listas = document.querySelectorAll("ul")
            const botao = document.getElementById("botao")
            if (botao.innerHTML == "Recolher listas") {
                listas.forEach(function(lista) {
                    lista.className = "esconde"
                })
                botao.innerHTML = "Expandir listas"
            } else {
                listas.forEach(function(lista) {
                    lista.className = "mostra"
                })
                botao.innerHTML = "Recolher listas"
            }
        }
    </script>
    <style>
        .mostra {
            display: block;
        }
        .esconde {
            display: none;
        }
    </style>
</head>
<body>
    <form>
        <button type="button" id="botao" onclick="mudaTodas()">
            Recolher listas
        </button>
    </form>
    <ol>
        <li onclick="mudaVisibilidade('listaTeste1')">
            Teste1
        </li>
        <ul id="listaTeste1" class="mostra">
            <li>bla</li>
            <li>bla</li>
            <li>bla</li>
        </ul>
        <li onclick="mudaVisibilidade('listaTeste2')">
            Teste2
        </li>
        <ul id="listaTeste2" class="mostra">
            <li>ble</li>
            <li>ble</li>
            <li>ble</li>
        </ul>
    </ol>
</body>
</html>
