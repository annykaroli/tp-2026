<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        input {
            width: 120px;
            padding: 8px;
            margin: 5px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
        }

        #resultado {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h2>Calculadora</h2>

    <input type="number" id="num1" placeholder="Primeiro número">
    <input type="number" id="num2" placeholder="Segundo número">

    <br><br>

    <button onclick="calcular('+')">+</button>
    <button onclick="calcular('-')">-</button>
    <button onclick="calcular('*')">*</button>
    <button onclick="calcular('/')">/</button>
    <button onclick="limpar()">Limpar</button>

    <div id="resultado">Aguardando valores...</div>

    <script>

        function calcular(operacao) {

            let n1 = Number(document.getElementById("num1").value);
            let n2 = Number(document.getElementById("num2").value);
            let resultado;

            switch (operacao) {
                case "+":
                    resultado = n1 + n2;
                    break;

                case "-":
                    resultado = n1 - n2;
                    break;

                case "*":
                    resultado = n1 * n2;
                    break;

                case "/":
                    if (n2 == 0) {
                        document.getElementById("resultado").innerHTML = "Não é possível dividir por zero!";
                        return;
                    }
                    resultado = n1 / n2;
                    break;
            }

            document.getElementById("resultado").innerHTML = "Resultado: " + resultado;

            document.getElementById("num1").value = resultado;
            document.getElementById("num2").value = "";
            document.getElementById("num2").focus();
        } function limpar() {
            document.getElementById("num1").value = "";
            document.getElementById("num2").value = "";
            document.getElementById("resultado").innerHTML = "Aguardando valores...";
        }

    </script>

</body>
</html>
